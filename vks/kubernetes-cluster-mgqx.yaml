apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: argocd-kubernetes-cluster-mgqx
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.156.0/20
    services:
      cidrBlocks:
        - 10.96.0.0/12
    serviceDomain: cluster.local
  topology:
    class: builtin-generic-v3.4.0
    classNamespace: vmware-system-vks-public
    #version: v1.33.3---vmware.1-fips-vkr.1
    version: v1.31.14---vmware.1-fips-vkr.2
    variables:
      - name: kubernetes
        value:
          certificateRotation:
            enabled: true
            renewalDaysBeforeExpiry: 90
      - name: vmClass
        value: best-effort-xsmall
      - name: storageClass
        value: vsan-default-storage-policy
    controlPlane:
      replicas: 1
      metadata:
        annotations:
          run.tanzu.vmware.com/resolve-os-image: os-name=photon, content-library=cl-23c0447de00e67e0a
    workers:
      machineDeployments:
        - class: node-pool
          name: kubernetes-cluster-mgqx-np-pgy5
          replicas: 2
